name: Deploy site to S3

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CF_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::727710162649:role/nagarayan-github-deploy
          role-session-name: nagarayan-website-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload 3D assets (long cache)
        run: |
          aws s3 sync site/assets "s3://$S3_BUCKET/assets" --delete \
            --cache-control "public, max-age=604800"
          aws s3 cp site/assets/sky.hdr "s3://$S3_BUCKET/assets/sky.hdr" \
            --content-type "application/octet-stream" --cache-control "public, max-age=604800"
          for f in site/assets/*.glb; do
            aws s3 cp "$f" "s3://$S3_BUCKET/assets/$(basename "$f")" \
              --content-type "model/gltf-binary" --cache-control "public, max-age=604800"
          done

      - name: Upload page (short cache)
        run: |
          aws s3 cp site/index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 cp site/favicon.ico "s3://$S3_BUCKET/favicon.ico" \
            --content-type "image/x-icon" --cache-control "public, max-age=86400"

      - name: Refresh CloudFront
        if: ${{ env.CF_DIST_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "/*"
